id = "ya-ambilight"
name = "YA Ambilight"
version = "0.3.0"
entry = "bin/ya-ambilight"
description = "HyperHDR UDP Raw RGB to YAM rings, with optional Midi logo"
permissions = ["exec", "led"]

[launch]
kind = "binary"
mode = "service"
path = "bin/ya-ambilight"

[compatibility]
features = ["led.ring.rgb"]
